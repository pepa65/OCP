[alias]
rel = "build --release --target x86_64-unknown-linux-gnu"
inst = "install --target x86_64-unknown-linux-gnu --path ."
clip = "clippy --release --all-targets --all-features -- -D warnings"
pub = "publish --target x86_64-unknown-linux-gnu"
up = "update --verbose"
au = "audit --deny warnings"

[target.x86_64-unknown-linux-musl]
rustflags = [ "-Ctarget-feature=+crt-static", "-Ctarget-cpu=generic"]
